<html lang="en">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:#eef2f7;color:#172033}
.app{max-width:1700px;margin:auto;min-height:100vh}
.header{background:#101828;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.logo{display:flex;align-items:center;gap:12px}
.logo i{font-size:28px;color:#93c5fd}
.logo h1{font-size:1.45rem;font-weight:800}
.toolbar{display:flex;gap:9px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 16px;color:#fff;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.18s;font-family:inherit}
.btn:hover{transform:translateY(-1px);filter:brightness(.96)}
.btn-blue{background:#2563eb}.btn-green{background:#16a34a}.btn-red{background:#dc2626}.btn-amber{background:#d97706}.btn-slate{background:#475569}
.panel{background:#fff;margin:18px 20px;border-radius:24px;padding:20px;box-shadow:0 6px 18px rgba(15,23,42,.07)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-weight:800;color:#1f2937}
.field input,.field textarea,.field select{border:1px solid #cbd5e1;border-radius:14px;padding:12px 13px;font-size:15px;font-family:inherit;background:#fff}
.field textarea{min-height:120px;resize:vertical}
.hint{color:#64748b;font-size:.92rem;margin-top:10px;line-height:1.45}
.cards{padding:0 20px 40px;display:flex;flex-direction:column;gap:20px}
.empty{background:#fff;border-radius:26px;padding:75px 20px;text-align:center;color:#64748b;box-shadow:0 6px 18px rgba(15,23,42,.07)}
.empty i{font-size:72px;margin-bottom:16px;color:#94a3b8}
.snag-card{background:#fff;border-radius:28px;padding:20px;box-shadow:0 6px 18px rgba(15,23,42,.07);display:grid;grid-template-columns:minmax(280px,400px) minmax(0,1fr);gap:22px;border:1px solid #e2e8f0;align-items:start}
.photo-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:22px;overflow:hidden;height:310px;display:flex;align-items:center;justify-content:center}
.photo-box img{width:100%;height:100%;object-fit:contain;background:#fff}
.card-body{display:flex;flex-direction:column;gap:14px}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.badge{background:#dbeafe;color:#1e40af;border-radius:999px;padding:8px 16px;font-weight:900}
.delete-btn{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:999px;padding:8px 13px;font-weight:800;cursor:pointer}
.priority-low{background:#dcfce7!important;color:#166534!important;font-weight:900}
.priority-medium{background:#fef3c7!important;color:#92400e!important;font-weight:900}
.priority-high{background:#fee2e2!important;color:#991b1b!important;font-weight:900}
.priority-critical{background:#7f1d1d!important;color:#fff!important;font-weight:900}
.status-line{margin:0 20px 18px;color:#475569;font-weight:700}
@media(max-width:950px){
  body{background:#f3f6fb}
  .app{width:100%}
  .header{position:relative;align-items:flex-start;padding:14px}
  .logo h1{font-size:1.15rem}
  .panel{margin:12px;border-radius:18px;padding:14px}
  .cards{padding:0 12px 28px;gap:14px}
  .snag-card{grid-template-columns:1fr;padding:14px;border-radius:20px;gap:14px}
  .photo-box{height:240px;border-radius:16px}
  .toolbar .btn{flex:1;justify-content:center;min-width:145px}
  .toolbar{width:100%}
}
@media(max-width:520px){
  .header{padding:12px}
  .logo i{font-size:22px}.logo h1{font-size:1rem}
  .btn{padding:9px 12px;font-size:13px}
  .meta-grid{grid-template-columns:1fr;gap:10px}
  .field input,.field textarea,.field select{font-size:14px;padding:10px}
  .photo-box{height:210px}
  .card-top{align-items:flex-start}
  .badge,.delete-btn{font-size:12px;padding:7px 10px}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <i class="fa-solid fa-clipboard-check"></i>
      <h1>Snagging Report Maker</h1>
    </div>
    <div class="toolbar">
      <button class="btn btn-blue" id="importBtn"><i class="fa-solid fa-images"></i>Import Photos</button>
      <button class="btn btn-green" id="exportActionBtn"><i class="fa-solid fa-file-code"></i>Export Action Plan HTML</button>
      <button class="btn btn-amber" id="saveAuditJsonBtn"><i class="fa-solid fa-floppy-disk"></i>Save Audit JSON</button>
      <button class="btn btn-slate" id="loadAuditJsonBtn"><i class="fa-solid fa-folder-open"></i>Load Audit JSON</button>
      <button class="btn btn-red" id="clearBtn"><i class="fa-solid fa-trash"></i>Clear</button>
    </div>
  </div>

  <div class="panel">
    <div class="meta-grid">
      <div class="field">
        <label>Property Name</label>
        <input type="text" id="propertyName" placeholder="Enter property name">
      </div>
      <div class="field">
        <label>Venue Name</label>
        <input type="text" id="venueName" placeholder="Enter venue name">
      </div>
      <div class="field">
        <label>Auditor Name</label>
        <input type="text" id="auditorName" placeholder="Enter auditor name">
      </div>
      <div class="field">
        <label>Audit Date</label>
        <input type="date" id="auditDate">
      </div>
    </div>
    <p class="hint">
      Auditor screen is audit-only: add snag photo, location, comment, priority and snag date. Corrective action fields are created only inside the exported action plan.
    </p>
  </div>

  <div class="status-line" id="statusLine">0 snagging item(s).</div>

  <div class="cards" id="cardsWrapper">
    <div class="empty">
      <i class="fa-solid fa-camera"></i>
      <h2>No Snagging Items Yet</h2>
      <p>Click Import Photos to start the audit.</p>
    </div>
  </div>
</div>

<input type="file" id="loadAuditJsonInput" accept=".json,application/json" style="display:none">

<script>
let photos = [];
let nextId = 1;

const cardsWrapper = document.getElementById("cardsWrapper");
const statusLine = document.getElementById("statusLine");

function todayISO(){
  return new Date().toISOString().slice(0,10);
}

function formatDateDisplay(value){
  if(!value) return "";
  const d = new Date(value + "T00:00:00");
  if(isNaN(d)) return value;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return String(d.getDate()).padStart(2,"0") + "/" + months[d.getMonth()] + "/" + d.getFullYear();
}

function formatDateTimeNow(){
  const now = new Date();
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const datePart = String(now.getDate()).padStart(2,"0") + "/" + months[now.getMonth()] + "/" + now.getFullYear();
  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,"0");
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return datePart + " " + String(h).padStart(2,"0") + ":" + m + " " + ampm;
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}

function priorityClass(priority){
  if(priority === "Low") return "priority-low";
  if(priority === "Medium") return "priority-medium";
  if(priority === "High") return "priority-high";
  return "priority-critical";
}

async function compressImage(dataUrl, maxWidth=1200, quality=.68){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      if(w > maxWidth){
        h = Math.round(h * maxWidth / w);
        w = maxWidth;
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

document.getElementById("auditDate").value = todayISO();

document.getElementById("importBtn").onclick = () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.multiple = true;

  input.onchange = async e => {
    const files = Array.from(e.target.files || []);
    for(const file of files){
      const dataURL = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ev => resolve(ev.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const compressed = await compressImage(dataURL, 1400, .72);

      photos.push({
        id: nextId++,
        auditorPhoto: compressed,
        filename: file.name,
        location: "",
        auditorComment: "",
        priority: "Medium",
        snagDate: todayISO()
      });
    }
    renderCards();
  };

  input.click();
};

function renderCards(){
  statusLine.textContent = photos.length + " snagging item(s).";

  if(!photos.length){
    cardsWrapper.innerHTML = `
      <div class="empty">
        <i class="fa-solid fa-camera"></i>
        <h2>No Snagging Items Yet</h2>
        <p>Click Import Photos to start the audit.</p>
      </div>`;
    return;
  }

  cardsWrapper.innerHTML = "";

  photos.forEach((p,index)=>{
    const card = document.createElement("div");
    card.className = "snag-card";

    card.innerHTML = `
      <div class="photo-box">
        <img src="${p.auditorPhoto}" alt="Auditor photo">
      </div>

      <div class="card-body">
        <div class="card-top">
          <div class="badge">SNAG #${index + 1}</div>
          <button class="delete-btn" onclick="deleteSnag(${index})">
            <i class="fa-solid fa-trash"></i> Delete
          </button>
        </div>

        <div class="field">
          <label>Location</label>
          <input type="text" value="${esc(p.location)}" oninput="photos[${index}].location=this.value">
        </div>

        <div class="field">
          <label>Auditor Comment</label>
          <textarea oninput="photos[${index}].auditorComment=this.value">${esc(p.auditorComment)}</textarea>
        </div>

        <div class="field">
          <label>Priority</label>
          <select class="${priorityClass(p.priority)}" onchange="photos[${index}].priority=this.value; this.className=priorityClass(this.value)">
            <option ${p.priority==="Low"?"selected":""}>Low</option>
            <option ${p.priority==="Medium"?"selected":""}>Medium</option>
            <option ${p.priority==="High"?"selected":""}>High</option>
            <option ${p.priority==="Critical"?"selected":""}>Critical</option>
          </select>
        </div>

        <div class="field">
          <label>Snag Date</label>
          <input type="date" value="${esc(p.snagDate || todayISO())}" oninput="photos[${index}].snagDate=this.value">
        </div>
      </div>
    `;

    cardsWrapper.appendChild(card);
  });
}

function deleteSnag(index){
  photos.splice(index,1);
  renderCards();
}

document.getElementById("clearBtn").onclick = () => {
  if(confirm("Clear all snagging items?")){
    photos = [];
    nextId = 1;
    renderCards();
  }
};

function auditPayload(){
  return {
    version: "snag-audit-v2",
    savedAt: new Date().toISOString(),
    propertyName: document.getElementById("propertyName").value,
    venueName: document.getElementById("venueName").value,
    auditorName: document.getElementById("auditorName").value,
    auditDate: document.getElementById("auditDate").value,
    photos
  };
}

function downloadText(filename, text, type="application/json"){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

document.getElementById("saveAuditJsonBtn").onclick = () => {
  const property = document.getElementById("propertyName").value || "Snagging_Audit";
  downloadText(property.replace(/\s+/g,"_") + "_Audit_Project.json", JSON.stringify(auditPayload(), null, 2));
};

document.getElementById("loadAuditJsonBtn").onclick = () => {
  document.getElementById("loadAuditJsonInput").click();
};

document.getElementById("loadAuditJsonInput").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    document.getElementById("propertyName").value = data.propertyName || "";
    document.getElementById("venueName").value = data.venueName || "";
    document.getElementById("auditorName").value = data.auditorName || "";
    document.getElementById("auditDate").value = data.auditDate || todayISO();
    photos = Array.isArray(data.photos) ? data.photos : [];
    nextId = Math.max(0, ...photos.map(p => Number(p.id)||0)) + 1;
    renderCards();
  }catch(err){
    alert("Could not load JSON file: " + err.message);
  }
});

document.getElementById("exportActionBtn").onclick = exportActionPlanHTML;

async function exportActionPlanHTML(){
  if(!photos.length){
    alert("Please import at least one snagging photo first.");
    return;
  }

  const propertyName = document.getElementById("propertyName").value.trim();
  const venueName = document.getElementById("venueName").value.trim();
  const auditorName = document.getElementById("auditorName").value.trim();
  const auditDate = document.getElementById("auditDate").value;

  const exportPhotos = [];
  for(const p of photos){
    exportPhotos.push({
      id: p.id,
      auditorPhoto: await compressImage(p.auditorPhoto, 1000, .62),
      location: p.location || "",
      auditorComment: p.auditorComment || "",
      priority: p.priority || "Medium",
      snagDate: p.snagDate || todayISO(),
      rectificationPhoto: "",
      correctiveComment: "",
      responsiblePerson: "",
      status: "Open",
      fixingDate: ""
    });
  }

  const actionHtml = buildActionPlanHTML({
    propertyName,
    venueName,
    auditorName,
    auditDate,
    generatedAt: formatDateTimeNow(),
    items: exportPhotos
  });

  const safeName = (propertyName || "Snagging_Action_Plan").replace(/[^\w\-]+/g,"_");
  downloadText(safeName + "_Action_Plan.html", actionHtml, "text/html");
}

function buildActionPlanHTML(payload){
  const json = JSON.stringify(payload).replace(/</g, "\\u003c");

  return `<!DOCTYPE html>

.pdf-item-title{font-size:9pt;font-weight:900;color:#111827;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf-badge{display:inline-block;border-radius:999px;padding:1.5mm 2mm;font-size:6.8pt;font-weight:900;text-align:center;white-space:nowrap}
.pdf-open{background:#fee2e2;color:#991b1b}.pdf-progress{background:#fef3c7;color:#92400e}.pdf-completed{background:#dcfce7;color:#166534}
.pdf-priority{font-size:7pt;font-weight:900;color:#334155;text-align:right;white-space:nowrap}
.pdf-item-body{height:116mm;padding:2mm;display:grid;grid-template-columns:78mm 1fr;gap:2.5mm;align-items:start;overflow:hidden}
.pdf-photo-stack{display:flex;flex-direction:column;gap:1.2mm;align-items:center;overflow:hidden}
.pdf-photo-block{width:300px;break-inside:avoid;page-break-inside:avoid}
.pdf-photo-title{height:11px;background:#eef2f7;color:#334155;font-size:5.6pt;font-weight:900;padding:1px 6px;border:1px solid #cbd5e1;border-bottom:0;border-radius:2mm 2mm 0 0;text-transform:uppercase;letter-spacing:.15px;line-height:9px}
.pdf-photo-frame{width:300px;height:200px;border:1px solid #cbd5e1;border-radius:0 0 2mm 2mm;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.pdf-photo-frame img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.pdf-photo-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:900;font-size:8pt;text-align:center;padding:3mm;background:#f8fafc}
.pdf-details{height:111mm;border:1px solid #dbe4ef;border-radius:2.5mm;overflow:hidden;background:#fff;display:grid;grid-template-rows:1fr 1fr}
.pdf-info-section{min-height:0;display:flex;flex-direction:column;border-bottom:1px solid #cbd5e1;overflow:hidden}
.pdf-info-section:last-child{border-bottom:0}
.pdf-info-heading{background:#0f4c81;color:#fff;font-size:6.9pt;font-weight:900;text-transform:uppercase;letter-spacing:.2px;padding:1.2mm 2mm;flex:0 0 auto}
.pdf-info-heading.responsible{background:#15803d}
.pdf-detail-row{display:grid;grid-template-columns:26mm 1fr;border-bottom:1px solid #e2e8f0;min-height:6.2mm;flex:0 0 auto}
.pdf-detail-row:last-child{border-bottom:0}
.pdf-detail-row.tall{min-height:12mm;overflow:hidden;flex:1 1 auto}
.pdf-detail-label{background:#f8fafc;padding:1.1mm 1.5mm;font-size:5.8pt;font-weight:900;text-transform:uppercase;color:#0f4c81;border-right:1px solid #e2e8f0;line-height:1.1}
.pdf-detail-value{padding:1.1mm 1.5mm;font-size:6.8pt;line-height:1.18;color:#111827;overflow:hidden;word-break:break-word}
.pdf-footer{position:absolute;left:7mm;right:7mm;bottom:3mm;border-top:1px solid #cbd5e1;padding-top:1mm;display:flex;justify-content:space-between;color:#64748b;font-size:6.6pt;font-weight:900;text-transform:uppercase;letter-spacing:.4px}
@media(max-width:900px){
  .grid,.meta{grid-template-columns:1fr}.stamp{width:max-content}
  .pdf-meta,.pdf-summary{grid-template-columns:1fr}
  .pdf-sheet{width:auto;height:auto;min-height:auto;padding:14px;overflow:visible;break-after:auto;page-break-after:auto}
  .pdf-header{height:auto}.pdf-items-page{height:auto;overflow:visible}.pdf-item-card{height:auto}.pdf-item-body{height:auto;grid-template-columns:1fr;overflow:visible}.pdf-item-top{height:auto;grid-template-columns:1fr}.pdf-photo-stack{align-items:center}.pdf-details{height:auto}.pdf-detail-row{grid-template-columns:1fr}.pdf-footer{position:static;margin-top:12px}
}
</style>
</head>
<body>
<div class="report" id="reportRoot">
  <div class="topbar">
    <div><h1><i class="fa-solid fa-screwdriver-wrench"></i> Snagging Action Plan</h1><small>Fill corrective actions, attach rectification photo, then export the corporate PDF report.</small></div>
    <div class="stamp">Generated<br>${esc(payload.generatedAt)}</div>
  </div>
  <div class="toolbar no-pdf">
    <button class="btn btn-green" onclick="exportPdf()"><i class="fa-solid fa-file-pdf"></i>Export Corporate PDF</button>
    <button class="btn btn-blue" onclick="saveActionJson()"><i class="fa-solid fa-floppy-disk"></i>Save Action JSON</button>
    <button class="btn btn-slate" onclick="document.getElementById('loadActionJsonInput').click()"><i class="fa-solid fa-folder-open"></i>Load Action JSON</button>
  </div>
  <input type="file" id="loadActionJsonInput" accept=".json,application/json" style="display:none">
  <div class="meta">
    <div class="meta-box"><span>Property Name</span><b id="hProperty"></b></div>
    <div class="meta-box"><span>Venue Name</span><b id="hVenue"></b></div>
    <div class="meta-box"><span>Auditor Name</span><b id="hAuditor"></b></div>
    <div class="meta-box"><span>Audit Date</span><b id="hAuditDate"></b></div>
  </div>
  <div class="progress-card"><b id="progressText">0 / 0 Completed</b><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
  <div id="items"></div>
</div>
<div id="pdfHost" style="display:none"></div>
<script>
let payload = ${json};
function esc(s){return String(s ?? '').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];});}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function formatDateDisplay(value){if(!value)return '';const d=new Date(value+'T00:00:00');if(isNaN(d))return value;const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return String(d.getDate()).padStart(2,'0')+'/'+months[d.getMonth()]+'/'+d.getFullYear();}
function statusClass(s){if(s==='Completed')return 'status-completed';if(s==='In Progress')return 'status-progress';return 'status-open';}
function pdfStatusClass(s){if(s==='Completed')return 'pdf-completed';if(s==='In Progress')return 'pdf-progress';return 'pdf-open';}
async function compressImage(dataUrl,maxWidth=1000,quality=.62){return new Promise(resolve=>{const img=new Image();img.onload=()=>{let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth;}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality));};img.onerror=()=>resolve(dataUrl);img.src=dataUrl;});}
function setHeader(){document.getElementById('hProperty').textContent=payload.propertyName||'';document.getElementById('hVenue').textContent=payload.venueName||'';document.getElementById('hAuditor').textContent=payload.auditorName||'';document.getElementById('hAuditDate').textContent=formatDateDisplay(payload.auditDate);}
function render(){setHeader();const root=document.getElementById('items');root.innerHTML='';payload.items.forEach(function(item,index){const div=document.createElement('div');div.className='item';div.innerHTML='<div class="item-title">SNAG #'+(index+1)+'</div><div class="grid"><div class="frame audit"><h3><i class="fa-solid fa-user-check"></i> Auditor Finding</h3><div class="img-frame"><img src="'+item.auditorPhoto+'" alt="Auditor photo"></div><div class="field"><label>Location</label><input class="readonly" readonly value="'+esc(item.location)+'"></div><div class="field"><label>Auditor Comment</label><textarea class="readonly" readonly>'+esc(item.auditorComment)+'</textarea></div><div class="field"><label>Priority</label><input class="readonly" readonly value="'+esc(item.priority)+'"></div><div class="field"><label>Snag Date</label><input class="readonly" readonly value="'+formatDateDisplay(item.snagDate)+'"></div></div><div class="frame action"><h3><i class="fa-solid fa-helmet-safety"></i> Action By Responsible Person</h3><div class="img-frame" id="previewBox'+index+'">'+(item.rectificationPhoto?'<img src="'+item.rectificationPhoto+'" alt="Responsible Person photo">':'Responsible Person Photo Preview')+'</div><div class="field no-pdf"><label>Upload Responsible Person Photo</label><input type="file" accept="image/*" onchange="uploadRectPhoto(event,'+index+')"></div><div class="field"><label>Corrective Action Comment</label><textarea oninput="payload.items['+index+'].correctiveComment=this.value">'+esc(item.correctiveComment)+'</textarea></div><div class="field"><label>Responsible Person</label><input type="text" value="'+esc(item.responsiblePerson)+'" oninput="payload.items['+index+'].responsiblePerson=this.value"></div><div class="field"><label>Status</label><select class="'+statusClass(item.status)+'" onchange="updateStatus(this,'+index+')"><option '+(item.status==='Open'?'selected':'')+'>Open</option><option '+(item.status==='In Progress'?'selected':'')+'>In Progress</option><option '+(item.status==='Completed'?'selected':'')+'>Completed</option></select></div><div class="field"><label>Fixing Date</label><input type="date" value="'+esc(item.fixingDate||'')+'" oninput="payload.items['+index+'].fixingDate=this.value"></div></div></div>';root.appendChild(div);});updateProgress();}
async function uploadRectPhoto(event,index){const file=event.target.files&&event.target.files[0];if(!file)return;const dataURL=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=ev=>resolve(ev.target.result);reader.onerror=reject;reader.readAsDataURL(file);});payload.items[index].rectificationPhoto=await compressImage(dataURL,1000,.62);document.getElementById('previewBox'+index).innerHTML='<img src="'+payload.items[index].rectificationPhoto+'" alt="Responsible Person photo">';}
function updateStatus(select,index){payload.items[index].status=select.value;if(select.value==='Completed'&&!payload.items[index].fixingDate){payload.items[index].fixingDate=todayISO();}select.className=statusClass(select.value);render();}
function updateProgress(){const total=payload.items.length;const completed=payload.items.filter(x=>x.status==='Completed').length;const percent=total?Math.round((completed/total)*100):0;document.getElementById('progressText').textContent=completed+' / '+total+' Completed · '+percent+'%';document.getElementById('progressFill').style.width=percent+'%';}
function downloadText(filename,text,type='application/json'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
function saveActionJson(){payload.savedAt=new Date().toISOString();const safe=(payload.propertyName||'Snagging_Action').replace(/[^\\w\\-]+/g,'_');downloadText(safe+'_Action_Project.json',JSON.stringify(payload,null,2));}
document.getElementById('loadActionJsonInput').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{payload=JSON.parse(await file.text());render();}catch(err){alert('Could not load Action JSON: '+err.message);}});
function buildPdfReport(){
  const total=payload.items.length;
  const completed=payload.items.filter(x=>x.status==='Completed').length;
  const inProgress=payload.items.filter(x=>x.status==='In Progress').length;
  const open=payload.items.filter(x=>x.status==='Open').length;
  const percent=total?Math.round((completed/total)*100):0;

  function safeText(value, fallback='—'){
    const text = String(value ?? '').trim();
    return text ? esc(text) : fallback;
  }

  function coverPage(){
    return '<div class="pdf-sheet">'
      +'<div class="pdf-header">'
        +'<div class="pdf-conf">PRIVATE & CONFIDENTIAL</div>'
        +'<div class="pdf-title-row">'
          +'<div><div class="pdf-title">Snagging Audit Report</div><div class="pdf-subtitle">Summary Dashboard</div></div>'
          +'<div class="pdf-stamp">Generated<br>'+esc(payload.generatedAt||'')+'</div>'
        +'</div>'
      +'</div>'
      +'<div class="pdf-cover-card">'
        +'<div class="pdf-cover-heading">Report Information</div>'
        +'<div class="pdf-meta">'
          +'<div class="pdf-cell"><div class="pdf-label">Property Name</div><div class="pdf-value">'+safeText(payload.propertyName)+'</div></div>'
          +'<div class="pdf-cell"><div class="pdf-label">Venue Name</div><div class="pdf-value">'+safeText(payload.venueName)+'</div></div>'
          +'<div class="pdf-cell"><div class="pdf-label">Audit Date</div><div class="pdf-value">'+(formatDateDisplay(payload.auditDate)||'—')+'</div></div>'
          +'<div class="pdf-cell"><div class="pdf-label">Auditor Name</div><div class="pdf-value">'+safeText(payload.auditorName)+'</div></div>'
        +'</div>'
      +'</div>'
      +'<div class="pdf-summary">'
        +'<div class="pdf-stat"><strong>'+total+'</strong><span>Total Snags</span></div>'
        +'<div class="pdf-stat"><strong>'+completed+'</strong><span>Completed</span></div>'
        +'<div class="pdf-stat"><strong>'+inProgress+'</strong><span>In Progress</span></div>'
        +'<div class="pdf-stat"><strong>'+open+'</strong><span>Open</span></div>'
      +'</div>'
      +'<div class="pdf-progress-panel">'
        +'<div class="pdf-progress-title"><span>Action Plan Completion</span><span>'+completed+' / '+total+' · '+percent+'%</span></div>'
        +'<div class="pdf-progress-track"><div class="pdf-progress-fill" style="width:'+percent+'%"></div></div>'
      +'</div>'
      +'<div class="pdf-note">This report is generated as a controlled audit document. Page 1 contains report information and the progress dashboard. Detailed photographic evidence and responsible-person action details start from page 2, with two snagging items per page.</div>'
      +'<div class="pdf-footer"><span>PRIVATE & CONFIDENTIAL</span><span>Page 1</span></div>'
    +'</div>';
  }

  function itemCard(item,index){
    return '<div class="pdf-item-card">'
      +'<div class="pdf-item-top">'
        +'<div class="pdf-item-no">#'+(index+1)+'</div>'
        +'<div class="pdf-item-title">'+safeText(item.location,'Snagging Item')+'</div>'
        +'<div><span class="pdf-badge '+pdfStatusClass(item.status)+'">'+esc(item.status||'Open')+'</span></div>'
        +'<div class="pdf-priority">Priority: '+safeText(item.priority,'—')+'</div>'
      +'</div>'
      +'<div class="pdf-item-body">'
        +'<div class="pdf-photo-stack">'
          +'<div class="pdf-photo-block"><div class="pdf-photo-title">Inspection Photo</div><div class="pdf-photo-frame"><img src="'+item.auditorPhoto+'" alt="Inspection Photo"></div></div>'
          +'<div class="pdf-photo-block"><div class="pdf-photo-title">Responsible / Rectification Photo</div><div class="pdf-photo-frame">'
            +(item.rectificationPhoto?'<img src="'+item.rectificationPhoto+'" alt="Rectification Photo">':'<div class="pdf-photo-empty">No rectification photo attached</div>')
          +'</div></div>'
        +'</div>'
        +'<div class="pdf-details">'
          +'<div class="pdf-info-section">'
            +'<div class="pdf-info-heading">Auditor Information</div>'
            +'<div class="pdf-detail-row"><div class="pdf-detail-label">Location</div><div class="pdf-detail-value">'+safeText(item.location)+'</div></div>'
            +'<div class="pdf-detail-row"><div class="pdf-detail-label">Snag Date</div><div class="pdf-detail-value">'+(formatDateDisplay(item.snagDate)||'—')+'</div></div>'
            +'<div class="pdf-detail-row"><div class="pdf-detail-label">Priority</div><div class="pdf-detail-value">'+safeText(item.priority)+'</div></div>'
            +'<div class="pdf-detail-row tall"><div class="pdf-detail-label">Auditor Comment</div><div class="pdf-detail-value">'+safeText(item.auditorComment)+'</div></div>'
          +'</div>'
          +'<div class="pdf-info-section">'
            +'<div class="pdf-info-heading responsible">Responsible Person Action</div>'
            +'<div class="pdf-detail-row"><div class="pdf-detail-label">Responsible</div><div class="pdf-detail-value">'+safeText(item.responsiblePerson)+'</div></div>'
            +'<div class="pdf-detail-row"><div class="pdf-detail-label">Status</div><div class="pdf-detail-value">'+safeText(item.status,'Open')+'</div></div>'
            +'<div class="pdf-detail-row"><div class="pdf-detail-label">Fixing Date</div><div class="pdf-detail-value">'+(formatDateDisplay(item.fixingDate)||'—')+'</div></div>'
            +'<div class="pdf-detail-row tall"><div class="pdf-detail-label">Corrective Action</div><div class="pdf-detail-value">'+safeText(item.correctiveComment)+'</div></div>'
          +'</div>'
        +'</div>'
      +'</div>'
    +'</div>';
  }

  function itemsPage(startIndex,pageNo){
    let html = '<div class="pdf-sheet">'
      +'<div class="pdf-header">'
        +'<div class="pdf-conf">PRIVATE & CONFIDENTIAL</div>'
        +'<div class="pdf-title-row">'
          +'<div><div class="pdf-title">Snagging Action Details</div><div class="pdf-subtitle">'+safeText(payload.propertyName,'')+' · '+safeText(payload.venueName,'')+'</div></div>'
          +'<div class="pdf-stamp">Items #'+(startIndex+1)+(payload.items[startIndex+1]?'–#'+(startIndex+2):'')+'<br>Action Details</div>'
        +'</div>'
      +'</div>'
      +'<div class="pdf-items-page">'
        +itemCard(payload.items[startIndex],startIndex);
    if(payload.items[startIndex+1]) html += itemCard(payload.items[startIndex+1],startIndex+1);
    html += '</div>'
      +'<div class="pdf-footer"><span>PRIVATE & CONFIDENTIAL</span><span>Page '+pageNo+'</span></div>'
    +'</div>';
    return html;
  }

  let pages=coverPage();
  let pageNo=2;
  for(let i=0;i<payload.items.length;i+=2){
    pages += itemsPage(i,pageNo++);
  }
  return pages;
}
function exportPdf(){const host=document.getElementById('pdfHost');host.innerHTML=buildPdfReport();host.style.display='block';const safe=(payload.propertyName||'Snagging_Action_Plan').replace(/[^\\w\\-]+/g,'_');html2pdf().set({margin:[0,0,0,0],filename:safe+'_Corporate_Snagging_Report.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},pagebreak:{mode:['css']}}).from(host).save().then(()=>{host.style.display='none';host.innerHTML='';});}
render();
<\/script>
</body>
</html>`;
}


renderCards();
</script>
</body>
</html>
